name: sonarqube

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  sonarqube:
    uses: PayConstruct/github-actions-workflows/.github/workflows/sonarqube.yml@eec085fe21b140ae5286ef879026db228c44d15f # v6.4.0
    with:
      aws-region: eu-west-1
      full-repo-name: ${{ github.repository }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TECH_AWS_ACCOUNT_IAM_ROLE: ${{ secrets.TECH_AWS_ACCOUNT_IAM_ROLE }}
      SONAR_SECURITY_GROUP_ID: ${{ secrets.SONAR_SECURITY_GROUP_ID }}
      ORG_NPMRC: ${{ secrets.ORG_NPMRC }}
