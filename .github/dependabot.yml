version: 2

registries:
  payconstruct-npm:
    type: "npm-registry"
    url: "https://npm.pkg.github.com"
    token: "${{secrets.ORBITAL_GITHUB_BOT_TOKEN}}"
    replaces-base: false

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    registries:
      - payconstruct-npm
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
